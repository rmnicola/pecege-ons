name: pecege-ons-etl

# Laboratório Pecege-ONS. Credenciais locais de exercício.

services:
  # A máquina do aluno: o VS Code se conecta a ela e o código roda aqui.
  # Também serve a API de clima local da aula 2 em localhost:8080.
  playground:
    build:
      context: ./.lab
      args:
        UID: ${ETL_UID:-1000}
        GID: ${ETL_GID:-1000}
    image: pecege-ons-playground:local
    hostname: playground
    working_dir: /work
    command: ["python", ".lab/api_clima.py"]
    environment:
      PG_DSN: postgresql://ons_lab:ons_lab@banco:5432/curva
      PGHOST: banco
      PGUSER: ons_lab
      PGPASSWORD: ons_lab
      PGDATABASE: curva
      CLIMA_URL: http://localhost:8080/v1/archive
      S3_ENDPOINT: http://rustfs:9000
      S3_ACCESS_KEY: ons_lab
      S3_SECRET_KEY: ons_lab_s3
      S3_BUCKET: aula2
    volumes:
      - ./:/work
    depends_on:
      banco: {condition: service_healthy}
      rustfs: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/saude')"]
      interval: 2s
      retries: 30

  # Fonte da carga. Na primeira subida, roda init.sql e carrega os CSVs da pasta.
  banco:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ons_lab
      POSTGRES_PASSWORD: ons_lab
      POSTGRES_DB: curva
      TZ: UTC
      PGTZ: UTC
    volumes:
      - ./.lab/banco:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ons_lab -h 127.0.0.1"]
      interval: 2s
      retries: 60

  # Aula 2: armazenamento de objetos compatível com S3.
  rustfs:
    image: rustfs/rustfs:1.0.3
    environment:
      RUSTFS_ACCESS_KEY: ons_lab
      RUSTFS_SECRET_KEY: ons_lab_s3
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "127.0.0.1:${RUSTFS_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9000/health"]
      interval: 2s
      retries: 60
